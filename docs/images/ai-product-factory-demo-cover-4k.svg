<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" role="img" aria-labelledby="title desc">
  <title id="title">AI Product Factory — 4K product demo cover</title>
  <desc id="desc">Premium light product demo cover showing the AI Product Factory workflow from idea research and approval to code verification and source ZIP delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F9FF"/><stop offset="0.55" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3EEFF"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F8FF"/><stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#1E2B5A" flood-opacity="0.16"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E2B5A" flood-opacity="0.10"/>
    </filter>
    <style>
      .font{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .dark{fill:#0F172A}.muted{fill:#64748B}.blue{fill:#2563EB}.violet{fill:#7C3AED}.green{fill:#059669}
      .card{fill:#FFFFFF;stroke:#E2E8F0;stroke-width:3}.soft{fill:#F8FAFC;stroke:#E2E8F0;stroke-width:2}
      .label{font-size:28px;font-weight:800;letter-spacing:3px}.body{font-size:34px;font-weight:500}.small{font-size:27px;font-weight:500}
    </style>
  </defs>
  <rect width="3840" height="2160" fill="url(#bg)"/>
  <circle cx="480" cy="240" r="680" fill="#DCE8FF" opacity="0.42"/>
  <circle cx="3420" cy="240" r="650" fill="#EEE5FF" opacity="0.5"/>

  <g class="font">
    <rect x="215" y="165" width="82" height="82" rx="24" fill="url(#brand)"/>
    <path d="M245 210l18-18 18 18-18 18zM263 191l18 18-18 18" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="335" y="230" class="dark" font-size="118" font-weight="850">AI Product Factory</text>
    <text x="340" y="324" class="blue" font-size="47" font-weight="700">Idea → Research → Build → Verified Source ZIP</text>
    <g transform="translate(3010 170)">
      <rect width="595" height="92" rx="46" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="3"/>
      <circle cx="48" cy="46" r="16" fill="#10B981"/>
      <text x="82" y="59" class="green" font-size="34" font-weight="800">LIVE PRODUCT DEMO</text>
    </g>
  </g>

  <g filter="url(#shadow)" class="font">
    <rect x="185" y="470" width="3470" height="1375" rx="54" fill="#FFFFFF" stroke="#D8E0F0" stroke-width="4"/>
    <rect x="185" y="470" width="3470" height="105" rx="54" fill="#F8FAFC"/>
    <rect x="185" y="525" width="3470" height="50" fill="#F8FAFC"/>
    <circle cx="250" cy="522" r="16" fill="#FB7185"/><circle cx="302" cy="522" r="16" fill="#FBBF24"/><circle cx="354" cy="522" r="16" fill="#34D399"/>
    <rect x="560" y="494" width="1990" height="54" rx="27" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="630" y="532" class="muted" font-size="25" font-weight="650">AI Product Factory / Studio / Approved build</text>
    <rect x="3185" y="492" width="345" height="56" rx="28" fill="#ECFDF5"/>
    <circle cx="3226" cy="520" r="12" fill="#10B981"/>
    <text x="3252" y="531" class="green" font-size="25" font-weight="750">AI READY</text>
  </g>

  <g class="font" transform="translate(245 615)">
    <rect width="3345" height="118" rx="26" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <g transform="translate(30 18)"><rect width="760" height="82" rx="22" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2"/><circle cx="48" cy="41" r="21" fill="#10B981"/><text x="41" y="50" fill="#fff" font-size="25" font-weight="900">✓</text><text x="88" y="35" class="dark" font-size="26" font-weight="800">Describe</text><text x="88" y="63" class="muted" font-size="21">Explain the outcome</text></g>
    <g transform="translate(815 18)"><rect width="760" height="82" rx="22" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2"/><circle cx="48" cy="41" r="21" fill="#10B981"/><text x="41" y="50" fill="#fff" font-size="25" font-weight="900">✓</text><text x="88" y="35" class="dark" font-size="26" font-weight="800">Research</text><text x="88" y="63" class="muted" font-size="21">Inspect source evidence</text></g>
    <g transform="translate(1600 18)"><rect width="760" height="82" rx="22" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/><circle cx="48" cy="41" r="21" fill="#2563EB"/><text x="41" y="50" fill="#fff" font-size="22" font-weight="900">03</text><text x="88" y="35" class="dark" font-size="26" font-weight="800">Choose</text><text x="88" y="63" class="muted" font-size="21">Compare product plans</text></g>
    <g transform="translate(2385 18)"><rect width="930" height="82" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><circle cx="48" cy="41" r="21" fill="#CBD5E1"/><text x="39" y="50" fill="#fff" font-size="22" font-weight="900">04</text><text x="88" y="35" class="dark" font-size="26" font-weight="800">Build &amp; verify</text><text x="88" y="63" class="muted" font-size="21">Code, run, test and package</text></g>
  </g>

  <g class="font" transform="translate(245 770)">
    <rect width="1965" height="985" rx="34" fill="url(#soft)" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="42" y="42" width="300" height="48" rx="24" fill="#EEF2FF"/>
    <text x="72" y="75" class="violet label" font-size="22">NO CODING REQUIRED</text>
    <text x="45" y="178" class="dark" font-size="73" font-weight="870">Describe the outcome.</text>
    <text x="45" y="258" fill="url(#brand)" font-size="73" font-weight="870">AI builds the technical case.</text>
    <text x="48" y="322" class="muted" font-size="31" font-weight="520">Plain-language intent becomes capability research, source proof,</text>
    <text x="48" y="364" class="muted" font-size="31" font-weight="520">three practical plans and an approval-gated autonomous build.</text>

    <g transform="translate(45 420)">
      <rect width="890" height="115" rx="26" fill="#EFF6FF" stroke="#60A5FA" stroke-width="3"/>
      <text x="34" y="48" class="dark" font-size="30" font-weight="820">Create something new</text>
      <text x="34" y="84" class="muted" font-size="24">Start from an idea and let AI discover the safest route.</text>
      <circle cx="835" cy="40" r="18" fill="#2563EB"/><path d="M826 40l7 7 13-15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(965 420)">
      <rect width="950" height="115" rx="26" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
      <text x="34" y="48" class="dark" font-size="30" font-weight="820">Improve what I already have</text>
      <text x="34" y="84" class="muted" font-size="24">Keep working behavior and add capabilities safely.</text>
    </g>

    <g transform="translate(45 568)">
      <rect width="1870" height="250" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
      <text x="32" y="44" class="dark" font-size="25" font-weight="800">What should the product do for you?</text>
      <rect x="28" y="67" width="1814" height="150" rx="18" fill="#FBFDFF" stroke="#DCE5F4" stroke-width="2"/>
      <text x="57" y="108" class="dark" font-size="27">Create an application that can automate desktop workflows, understand screen state,</text>
      <text x="57" y="146" class="dark" font-size="27">learn from approved actions, verify generated code and deliver the complete source.</text>
      <rect x="57" y="178" width="245" height="24" rx="12" fill="#E0E7FF"/><rect x="316" y="178" width="222" height="24" rx="12" fill="#DBEAFE"/><rect x="552" y="178" width="292" height="24" rx="12" fill="#EDE9FE"/>
    </g>

    <g transform="translate(45 850)">
      <rect width="590" height="92" rx="23" class="card"/><text x="28" y="35" class="muted" font-size="22" font-weight="700">WHO WILL USE IT?</text><text x="28" y="68" class="dark" font-size="27" font-weight="700">Customers</text>
      <rect x="655" width="590" height="92" rx="23" class="card"/><text x="683" y="35" class="muted" font-size="22" font-weight="700">WHERE?</text><text x="683" y="68" class="dark" font-size="27" font-weight="700">Desktop + Web</text>
      <rect x="1310" width="560" height="92" rx="23" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2"/><text x="1340" y="35" class="green" font-size="22" font-weight="800">BUILD OUTPUT</text><text x="1340" y="68" class="dark" font-size="27" font-weight="800">Verified source ZIP</text>
    </g>
  </g>

  <g class="font" transform="translate(2245 770)">
    <rect width="1345" height="985" rx="34" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="48" y="69" class="blue label">EXPERT ANALYSIS PIPELINE</text>
    <text x="48" y="132" class="dark" font-size="45" font-weight="860">Technical complexity stays underneath.</text>
    <text x="48" y="180" class="muted" font-size="27">Evidence, approval and executable checks stay inspectable.</text>

    <g transform="translate(48 225)">
      <g filter="url(#smallShadow)"><rect width="1248" height="86" rx="23" class="card"/><circle cx="48" cy="43" r="24" fill="#0F172A"/><text x="35" y="51" fill="#fff" font-size="20" font-weight="900">01</text><text x="92" y="53" class="dark" font-size="28" font-weight="690">Understand the goal, users and constraints</text></g>
      <g transform="translate(0 102)" filter="url(#smallShadow)"><rect width="1248" height="86" rx="23" class="card"/><circle cx="48" cy="43" r="24" fill="#0F172A"/><text x="35" y="51" fill="#fff" font-size="20" font-weight="900">02</text><text x="92" y="53" class="dark" font-size="28" font-weight="690">Build the specialized capability graph</text></g>
      <g transform="translate(0 204)" filter="url(#smallShadow)"><rect width="1248" height="86" rx="23" class="card"/><circle cx="48" cy="43" r="24" fill="#0F172A"/><text x="35" y="51" fill="#fff" font-size="20" font-weight="900">03</text><text x="92" y="53" class="dark" font-size="28" font-weight="690">Inspect repositories and runnable-code evidence</text></g>
      <g transform="translate(0 306)" filter="url(#smallShadow)"><rect width="1248" height="86" rx="23" class="card"/><circle cx="48" cy="43" r="24" fill="#0F172A"/><text x="35" y="51" fill="#fff" font-size="20" font-weight="900">04</text><text x="92" y="53" class="dark" font-size="28" font-weight="690">Compare three practical product compositions</text></g>
      <g transform="translate(0 408)" filter="url(#smallShadow)"><rect width="1248" height="86" rx="23" class="card"/><circle cx="48" cy="43" r="24" fill="#0F172A"/><text x="35" y="51" fill="#fff" font-size="20" font-weight="900">05</text><text x="92" y="53" class="dark" font-size="28" font-weight="690">Lock only the exact plan you approve</text></g>
      <g transform="translate(0 510)" filter="url(#smallShadow)"><rect width="1248" height="86" rx="23" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="2"/><circle cx="48" cy="43" r="24" fill="#4F46E5"/><text x="35" y="51" fill="#fff" font-size="20" font-weight="900">06</text><text x="92" y="53" class="dark" font-size="28" font-weight="750">Code → run → repair → verify → ZIP</text></g>
    </g>

    <g transform="translate(48 855)">
      <rect width="1248" height="86" rx="24" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/>
      <circle cx="45" cy="43" r="20" fill="#10B981"/><path d="M35 43l7 7 15-18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <text x="82" y="36" class="green" font-size="24" font-weight="850">VERIFICATION-GATED DELIVERY</text>
      <text x="82" y="65" class="dark" font-size="22" font-weight="620">Runtime preview + source browser + downloadable ZIP</text>
    </g>
  </g>

  <g class="font">
    <rect x="510" y="1905" width="2820" height="125" rx="62" fill="#FFFFFF" stroke="#DCE5F4" stroke-width="3"/>
    <text x="1920" y="1984" text-anchor="middle" class="dark" font-size="46" font-weight="820">Describe → Research → Approve → Code → Run → Verify → Download ZIP</text>
    <text x="1920" y="2085" text-anchor="middle" class="muted" font-size="27" font-weight="600">High-resolution README cover • designed for sharp GitHub rendering</text>
  </g>
</svg>
