name: AI Product Factory CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Next.js lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Critical dependency audit
        run: npm audit --audit-level=critical
      - run: npm run lint
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - run: npm run build
        env:
          DATABASE_URL: file:./db/custom.db
          PYTHON_BACKEND_URL: http://127.0.0.1:8001

  python:
    name: Python tests and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python-backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: pytest -q
        env:
          LLM_PROVIDER: local
