name: AI Product Factory CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Next.js lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate local Understand Anything adapter
        run: |
          node --check scripts/install-understand-anything.mjs
          npm run understand:status
      - name: Critical dependency audit
        run: npm audit --audit-level=critical
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          DATABASE_URL: file:./db/custom.db
          PYTHON_BACKEND_URL: http://127.0.0.1:8001

  python:
    name: Contract, ownership and recovery regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q factory_core execution
      - run: pytest -q
        env:
          LLM_PROVIDER: local

  isolated-acceptance:
    name: Real isolated API and React acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r python-backend/requirements.txt
      - name: Provision isolated runner
        run: docker build -f python-backend/execution/runner.Dockerfile -t ai-product-factory-runner:1 .
      - name: Reject scaffold and verify real behavior
        working-directory: python-backend
        env:
          FACTORY_REQUIRE_RUNNER: '1'
        run: pytest -q tests/test_factory_core.py -k real_container

  e2e:
    name: Hydrated Studio, approval and ZIP ownership
    needs: [web, python]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: pip install -r python-backend/requirements.txt
      - run: npm run build
        env:
          DATABASE_URL: file:./db/custom.db
          PYTHON_BACKEND_URL: http://127.0.0.1:8001
      - name: Start services and exercise Studio
        env:
          LLM_PROVIDER: local
          PYTHON_BACKEND_PORT: '8001'
          PYTHON_BACKEND_URL: http://127.0.0.1:8001
          FACTORY_OUTPUT_DIR: ${{ github.workspace }}/python-backend/output
          DATABASE_URL: file:./db/custom.db
          HOSTNAME: 127.0.0.1
          PORT: '3000'
        run: |
          (cd python-backend && python runtime_entry.py > ../python-e2e.log 2>&1) &
          PYTHON_PID=$!
          node .next/standalone/server.js > next-e2e.log 2>&1 &
          NEXT_PID=$!
          trap 'kill "$PYTHON_PID" "$NEXT_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/api/health/python >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node scripts/ci-core-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: factory-e2e-logs
          path: '*-e2e.log'
