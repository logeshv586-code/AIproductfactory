name: Hydrate README demo media

on:
  push:
    branches:
      - fix/readme-inline-demo
    paths:
      - '.demo-upload/READY'

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/readme-inline-demo
          fetch-depth: 0
      - name: Reconstruct uploaded demo recording
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/media
          cat public/demo/ai-product-factory-demo.part*.b64 | tr -d '\r\n ' | base64 --decode > docs/media/ai-product-factory-demo.mp4
          test -s docs/media/ai-product-factory-demo.mp4
          file docs/media/ai-product-factory-demo.mp4
      - name: Generate README-visible animated preview
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -y -hide_banner -loglevel error \
            -i docs/media/ai-product-factory-demo.mp4 \
            -vf "fps=2,scale=560:-2:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=48:stats_mode=diff[p];[s1][p]paletteuse=dither=bayer:bayer_scale=5:diff_mode=rectangle" \
            -loop 0 docs/media/ai-product-factory-demo-preview.gif
          test -s docs/media/ai-product-factory-demo-preview.gif
          file docs/media/ai-product-factory-demo-preview.gif
      - name: Commit rendered media
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .demo-upload
          rm -f .github/workflows/hydrate-readme-demo.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Embed uploaded Product Factory demo media'
          git push origin HEAD:fix/readme-inline-demo
